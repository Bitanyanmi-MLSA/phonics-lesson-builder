<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phonics Lesson Builder</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>🔤 Phonics Lesson Builder</h1>
    <p class="subtitle">Phonemic Awareness for Ages 3–8</p>
  </header>

  <main class="app-main">
    <section class="controls">
      <label for="levelSelect">Lesson Level</label>
      <select id="levelSelect"></select>
      <p id="levelDescription" class="level-desc"></p>

      <label for="voiceSelect">Reading Voice</label>
      <select id="voiceSelect"></select>
      <p id="voiceHint" class="level-desc"></p>

      <div class="word-form">
        <label for="wordInput">Word</label>
        <input
          type="text"
          id="wordInput"
          placeholder="Type a word, e.g. cat, rabbit, sunshine..."
          autocomplete="off"
        />
        <div class="btn-row">
          <button id="analyzeBtn" class="primary-btn">Analyze</button>
          <button id="saveWordBtn" class="secondary-btn">💾 Save to Word List</button>
        </div>
      </div>
    </section>

    <section id="results" class="results">
      <p class="hint">Type a word above and press "Analyze" to build the lesson.</p>
    </section>

    <aside class="saved-words">
      <h3>Saved Words (this level)</h3>
      <ul id="savedWordsList" class="word-list"></ul>
    </aside>
  </main>

  <footer class="app-footer">
    <p>Works fully offline. Click any sound bubble to hear it spoken aloud.</p>
  </footer>

  <script src="js/phonics-engine.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
